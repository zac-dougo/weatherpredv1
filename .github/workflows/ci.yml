name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Lint with Ruff
        run: uv run --locked --only-group dev ruff check --output-format=github .

      - name: Check formatting with Ruff
        run: uv run --locked --only-group dev ruff format --check --diff .

      - name: Type check with mypy
        run: uv run --locked mypy src tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests (runtime dependencies only)
        run: uv run --locked --no-dev python -m unittest discover -s tests -v

  build:
    name: Build & Package Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test installed wheel
        run: |
          set -- dist/*.whl
          test "$#" -eq 1
          uv run --isolated --no-project --with "$1" python -c "import weatherpredv1; assert weatherpredv1.__version__"

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build]
    steps:
      - name: Check required jobs succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" ]]; then
            echo "CI failed: lint=$LINT_RESULT, test=$TEST_RESULT, build=$BUILD_RESULT"
            exit 1
          fi
